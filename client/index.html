<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FRIENDSLOP</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫠</text></svg>">
</head>
<body>

<!-- ============ MAIN MENU (the only real 2D screen) ============ -->
<div id="menu" class="screen">
  <div class="title-wrap">
    <h1 class="game-title"><span>F</span><span>R</span><span>I</span><span>E</span><span>N</span><span>D</span><span class="slop">S</span><span class="slop">L</span><span class="slop">O</span><span class="slop">P</span></h1>
    <p class="tagline">chained to the boys. one way out of the pit. don't bust.</p>
  </div>
  <div class="menu-card">
    <input id="nameInput" maxlength="18" placeholder="your name, chief" autocomplete="off">
    <button id="hostBtn" class="btn big green">HOST A GAME</button>
    <div class="join-row">
      <input id="codeInput" maxlength="4" placeholder="CODE" autocomplete="off">
      <button id="joinBtn" class="btn big pink">JOIN</button>
    </div>
    <p id="menuError" class="error-text"></p>
  </div>
  <p class="footer-note">2–8 players · co-op · WASD to move, SPACE to dash — everything else, you walk to</p>
</div>

<!-- ============ THE WORLD ============ -->
<div id="game" class="screen hidden">
  <canvas id="canvas"></canvas>
  <div id="vignette"></div>

  <div id="hud" class="hud hidden">
    <div id="hudCode" class="hud-pill gold" title="click to copy the room code"></div>
    <div id="hudChamber" class="hud-pill"></div>
    <div id="hudGoal" class="hud-pill green-pill"></div>
    <div id="hudLives" class="hud-pill red-pill"></div>
    <div id="hudTimer" class="hud-pill big-num"></div>
    <div id="hudMoney" class="hud-pill gold"></div>
  </div>

  <div id="hostTools" class="host-tools hidden">
    <button id="addBotBtn" class="btn small gray">+ BOT</button>
    <button id="kickBotBtn" class="btn small gray">− BOT</button>
  </div>

  <div id="ruleStrip" class="rule-strip hidden"></div>

  <div id="countdownBig" class="countdown hidden"></div>

  <!-- voice chat dock: join, mute, push-to-talk state, settings -->
  <div id="voiceDock" class="voice-dock">
    <button id="voiceJoinBtn" class="btn small green">🎙 JOIN VOICE</button>
    <div id="voiceLive" class="voice-live hidden">
      <button id="voiceMuteBtn" class="voice-btn" title="mute / unmute (M)">🎙</button>
      <span id="voiceTxHint" class="voice-hint"></span>
      <button id="voiceCfgBtn" class="voice-btn" title="voice settings">⚙️</button>
      <button id="voiceLeaveBtn" class="voice-btn" title="leave voice">✕</button>
    </div>
    <div id="voiceRoster" class="voice-roster"></div>
    <div id="voiceErr" class="voice-err hidden"></div>
  </div>

  <div id="voicePanel" class="voice-panel hidden">
    <h3>🎙 VOICE SETTINGS</h3>
    <label class="vrow">Mic
      <select id="voiceMicSel"></select>
    </label>
    <div class="vrow">
      <span>Mode</span>
      <label><input type="radio" name="voiceMode" value="open"> Open mic</label>
      <label><input type="radio" name="voiceMode" value="ptt"> Push-to-talk <kbd>V</kbd></label>
    </div>
    <label class="vrow">Volume
      <input id="voiceMasterVol" type="range" min="0" max="1" step="0.05">
    </label>
    <div id="voicePeerRows"></div>
    <p class="voice-note">M mutes your mic · V talks in push-to-talk · voice is peer-to-peer between the boys</p>
    <button id="voicePanelClose" class="btn small gray">CLOSE</button>
  </div>

  <div id="emoteBar" class="emote-bar"></div>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
