<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>asset preview</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #222; font: 13px 'Trebuchet MS', sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  #labels div { position: absolute; transform: translate(-50%, 0); color: #fff; background: rgba(0,0,0,.55); padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
  #err { position: fixed; top: 0; left: 0; color: #ff8a80; background: #000c; white-space: pre-wrap; padding: 8px; }
</style></head>
<body><canvas id="c"></canvas><div id="labels"></div><div id="err"></div>
<script type="module" src="/js/preview.js"></script>
</body></html>
